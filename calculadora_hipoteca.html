<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de hipoteca</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f3f0;
    color: #1a1a1a;
    margin: 0;
    padding: 1rem;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 1.2rem; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-bottom: 1rem;
    border: 1px solid #e3e2dd;
  }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
  select, input[type=number] {
    width: 100%;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #cfceca;
    padding: 0 10px;
    font-size: 15px;
    background: #fff;
    color: #1a1a1a;
  }
  select:disabled, input:disabled {
    background: #f0efec;
    color: #8a8983;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { margin-bottom: 12px; }
  .results { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .metric { background: #f4f3f0; border-radius: 8px; padding: 10px; text-align:center; }
  .metric p { margin: 0; }
  .metric .lbl { font-size: 11px; color: #666; margin-bottom: 4px; }
  .metric .val { font-size: 16px; font-weight: 600; }
  .warning { color: #b3261e; font-size: 13px; margin-top: 8px; display:none; }
  canvas { width: 100% !important; max-height: 220px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: right; padding: 4px 2px; border-bottom: 1px solid #eee; }
  th:first-child, td:first-child { text-align: left; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Calculadora de hipoteca (sistema francés)</h1>

  <div class="card">
    <div class="field">
      <label>Calcular</label>
      <select id="target">
        <option value="cuota">Cuota mensual</option>
        <option value="importe">Importe de la hipoteca</option>
        <option value="interes">Tipo de interés (TIN)</option>
        <option value="plazo">Plazo (años)</option>
      </select>
    </div>
    <div class="row">
      <div class="field">
        <label>Importe (EUR)</label>
        <input type="number" id="importe" value="200000" step="1000">
      </div>
      <div class="field">
        <label>TIN (%)</label>
        <input type="number" id="interes" value="3.0" step="0.05">
      </div>
      <div class="field">
        <label>Plazo (años)</label>
        <input type="number" id="plazo" value="25" step="1">
      </div>
      <div class="field">
        <label>Cuota mensual (EUR)</label>
        <input type="number" id="cuota" value="948" step="1">
      </div>
    </div>
    <p class="warning" id="warning"></p>
  </div>

  <div class="card">
    <div class="results">
      <div class="metric"><p class="lbl">Cuota mensual</p><p class="val" id="out-cuota">-</p></div>
      <div class="metric"><p class="lbl">Total intereses</p><p class="val" id="out-intereses">-</p></div>
      <div class="metric"><p class="lbl">Total pagado</p><p class="val" id="out-total">-</p></div>
    </div>
  </div>

  <div class="card">
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <label style="margin-bottom:8px;">Cuadro de amortización (resumen anual)</label>
    <table>
      <thead><tr><th>Año</th><th>Capital pagado</th><th>Intereses</th><th>Pendiente</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ids = ['importe','interes','plazo','cuota'];
const els = {};
ids.forEach(id => els[id] = document.getElementById(id));
const targetSel = document.getElementById('target');
const warningEl = document.getElementById('warning');
let chart = null;

function fmtEUR(v){ return Math.round(v).toLocaleString('es-ES') + ' EUR'; }

function paymentFromRatePN(P, rMonth, n){
  if (rMonth === 0) return P/n;
  const f = Math.pow(1+rMonth, n);
  return P * rMonth * f / (f - 1);
}
function principalFromRatePN(M, rMonth, n){
  if (rMonth === 0) return M*n;
  const f = Math.pow(1+rMonth, n);
  return M * (f-1) / (rMonth * f);
}
function monthsFromRatePM(M, P, rMonth){
  if (rMonth === 0) return P/M;
  const x = 1 - (rMonth*P)/M;
  if (x <= 0) return Infinity;
  return -Math.log(x) / Math.log(1+rMonth);
}
function rateFromPMN(M, P, n){
  let lo = 0, hi = 0.05;
  function f(r){ return paymentFromRatePN(P, r, n) - M; }
  let hiVal = f(hi), iter = 0;
  while (hiVal < 0 && iter < 60){ hi *= 1.5; hiVal = f(hi); iter++; }
  for (let i=0;i<80;i++){
    const mid = (lo+hi)/2;
    if (f(mid) > 0) hi = mid; else lo = mid;
  }
  return (lo+hi)/2;
}

function setRowsEnabled(){
  const t = targetSel.value;
  ids.forEach(id => { els[id].disabled = (id === t); });
}

function buildSchedule(P, rMonth, n){
  const rows = [];
  let balance = P;
  const M = paymentFromRatePN(P, rMonth, n);
  for (let m=1; m<=Math.round(n); m++){
    const interest = balance * rMonth;
    let capital = M - interest;
    if (m === Math.round(n)) capital = balance;
    balance = Math.max(0, balance - capital);
    rows.push({m, interest, capital, balance});
  }
  return rows;
}

function renderChart(rows){
  const years = Math.ceil(rows.length/12);
  const labels = [];
  const balances = [];
  for (let y=1; y<=years; y++){
    const idx = Math.min(y*12, rows.length) - 1;
    labels.push('Año ' + y);
    balances.push(Math.round(rows[idx].balance));
  }
  const ctx = document.getElementById('chart');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{
      label: 'Capital pendiente', data: balances,
      borderColor: '#2a78d6', backgroundColor: 'rgba(42,120,214,0.12)',
      fill: true, tension: 0.15, pointRadius: 0, borderWidth: 2
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { ticks: { callback: v => (v/1000) + 'k' } }, x: { ticks: { autoSkip: true, maxRotation: 0 } } }
    }
  });
}

function renderTable(rows){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const years = Math.ceil(rows.length/12);
  for (let y=1; y<=years; y++){
    const start = (y-1)*12, end = Math.min(y*12, rows.length);
    const slice = rows.slice(start, end);
    const capital = slice.reduce((a,r)=>a+r.capital,0);
    const interes = slice.reduce((a,r)=>a+r.interest,0);
    const pendiente = slice[slice.length-1].balance;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${y}</td><td>${Math.round(capital).toLocaleString('es-ES')}</td><td>${Math.round(interes).toLocaleString('es-ES')}</td><td>${Math.round(pendiente).toLocaleString('es-ES')}</td>`;
    tbody.appendChild(tr);
  }
}

function recalc(){
  warningEl.style.display = 'none';
  const t = targetSel.value;
  let P = parseFloat(els.importe.value);
  let rAnnual = parseFloat(els.interes.value);
  let years = parseFloat(els.plazo.value);
  let M = parseFloat(els.cuota.value);
  const n = years * 12;
  const rMonth = (rAnnual/100)/12;

  try {
    if (t === 'cuota'){
      M = paymentFromRatePN(P, rMonth, n);
      els.cuota.value = M.toFixed(0);
    } else if (t === 'importe'){
      P = principalFromRatePN(M, rMonth, n);
      els.importe.value = P.toFixed(0);
    } else if (t === 'plazo'){
      const nCalc = monthsFromRatePM(M, P, rMonth);
      if (!isFinite(nCalc) || nCalc <= 0){
        warningEl.textContent = 'La cuota introducida no cubre ni los intereses. Sube la cuota o baja el importe.';
        warningEl.style.display = 'block';
        return;
      }
      years = nCalc/12;
      els.plazo.value = years.toFixed(1);
    } else if (t === 'interes'){
      const r = rateFromPMN(M, P, n);
      rAnnual = Math.max(0, r*12*100);
      els.interes.value = rAnnual.toFixed(2);
    }

    const finalP = parseFloat(els.importe.value);
    const finalRAnnual = parseFloat(els.interes.value);
    const finalYears = parseFloat(els.plazo.value);
    const finalRMonth = (finalRAnnual/100)/12;
    const finalN = finalYears*12;
    const finalM = paymentFromRatePN(finalP, finalRMonth, finalN);

    document.getElementById('out-cuota').textContent = fmtEUR(finalM);
    const totalPagado = finalM*finalN;
    const totalIntereses = totalPagado - finalP;
    document.getElementById('out-total').textContent = fmtEUR(totalPagado);
    document.getElementById('out-intereses').textContent = fmtEUR(totalIntereses);

    const rows = buildSchedule(finalP, finalRMonth, finalN);
    renderChart(rows);
    renderTable(rows);
  } catch(e){
    warningEl.textContent = 'No se ha podido calcular con estos valores. Revisa las cifras.';
    warningEl.style.display = 'block';
  }
}

targetSel.addEventListener('change', () => { setRowsEnabled(); recalc(); });
ids.forEach(id => els[id].addEventListener('input', recalc));

setRowsEnabled();
recalc();
</script>
</body>
</html>
