<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gráfico: dos pagadores IRPF</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  html,body {
    width:1080px; height:1920px;
    background:#F3F1E8;
    font-family:'IBM Plex Sans', sans-serif;
    overflow:hidden;
  }

  .stage {
    width:1080px; height:1920px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative;
    padding:80px;
  }

  .eyebrow {
    font-family:'IBM Plex Mono', monospace;
    font-size:26px; letter-spacing:.16em; text-transform:uppercase;
    color:#AE4A30; font-weight:600;
    margin-bottom:36px;
  }

  .row {
    display:flex; align-items:center; gap:28px;
    margin-bottom:20px;
  }

  .card {
    background:#fff;
    border:2px solid #C9CFD4;
    border-radius:20px;
    padding:34px 40px;
    min-width:420px;
    display:flex; flex-direction:column; gap:10px;
  }

  .card .label {
    font-family:'IBM Plex Mono', monospace;
    font-size:24px; color:#3E5164; letter-spacing:.04em;
  }

  .card .amount {
    font-family:'IBM Plex Mono', monospace;
    font-weight:600; font-size:56px; color:#2F5D50;
    white-space:nowrap;
  }

  .op {
    font-family:'Fraunces', serif;
    font-weight:600; font-size:64px; color:#3E5164;
  }

  .divider {
    width:640px; height:4px; background:#20463B;
    margin:34px 0; border-radius:2px;
  }

  .result-card {
    background:#2F5D50;
    border-radius:24px;
    padding:44px 56px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    box-shadow: 0 24px 60px rgba(32,70,59,0.25);
  }

  .result-card .label {
    font-family:'IBM Plex Mono', monospace;
    font-size:26px; letter-spacing:.12em; text-transform:uppercase;
    color:#F3F1E8; opacity:.85;
  }

  .result-card .amount {
    font-family:'IBM Plex Mono', monospace;
    font-weight:700; font-size:96px; color:#fff;
  }

  .footnote {
    margin-top:56px;
    font-family:'Fraunces', serif;
    font-size:34px; font-weight:600; color:#182B3A;
    text-align:center; line-height:1.4;
    max-width:820px;
  }

  .footnote span { color:#AE4A30; }

  .tag {
    position:absolute; top:70px; right:80px;
    font-family:'IBM Plex Mono', monospace;
    font-size:24px; color:#3E5164; opacity:.6;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="tag">@entendertunomina</div>
    <div class="eyebrow">Dos pagadores · IRPF 2026</div>

    <div class="row">
      <div class="card">
        <div class="label">Empresa A</div>
        <div class="amount">15.000 €</div>
      </div>
      <div class="op">+</div>
      <div class="card">
        <div class="label">Empresa B</div>
        <div class="amount">15.000 €</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="result-card">
      <div class="label">Lo que suma Hacienda</div>
      <div class="amount">30.000 €</div>
    </div>

    <div class="footnote">Cada empresa retiene como si <span>ganaras solo eso</span>. Hacienda suma los dos.</div>
  </div>
</body>
</html>
